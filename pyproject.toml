[project]
name = "nyt_feed"
version = "0.1.0"
description = "Fetch NYT top stories from your terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pynytimes>=0.10.0", "rich>=15.0.0", "term-image>=0.7.2"]

[project.scripts]
nyt-feed = "nyt_feed.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
